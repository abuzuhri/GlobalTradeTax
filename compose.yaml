services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trade
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - trade_pg:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade"]
      interval: 5s
      retries: 10
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      TRADE_POSTGRES_CONNECTION: Host=postgres;Port=5432;Database=trade;Username=trade;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  trade_pg:
