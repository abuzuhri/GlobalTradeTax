name: UK public tariff contract drift

on:
  schedule:
    - cron: '17 7 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uk-public-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Probe GB, XI, dated geography and both exchange-rate feeds
        env:
          TRADE_RUN_UK_LIVE_CONTRACT: '1'
        run: dotnet test tests/GlobalTradeTax.Api.Tests/GlobalTradeTax.Api.Tests.csproj -c Release --filter 'Category=UkLiveContract' --logger 'trx;LogFileName=uk-public-contract.trx' --results-directory UkPublicContractResults
      - name: Upload contract drift or outage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uk-public-contract-results
          path: UkPublicContractResults/*.trx
          if-no-files-found: error
